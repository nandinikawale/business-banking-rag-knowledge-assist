[project]
name = "business-banking-rag-knowledge-assist"
version = "0.1.0"
description = "A cited RAG assistant over fictional business banking knowledge"
requires-python = ">=3.13,<3.14"
dependencies = [
  "chromadb>=1.0,<2",
  "fastapi>=0.115,<1",
  "numpy>=2.2,<3",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "streamlit>=1.65,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
banking-rag-index = "banking_rag.cli:build_index_main"
banking-rag-evaluate = "banking_rag.cli:evaluate_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_rag"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
